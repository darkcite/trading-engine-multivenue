[package]
name         = "core-config"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Boot-time config loader: reads the single `.env` file via dotenvy, materialises an mlock'd signing-key page, zeroizes on drop. Strictly out-of-hot-path."

[lib]
path = "src/lib.rs"

[dependencies]
core-regime = { workspace = true }
core-types = { workspace = true }
dotenvy = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { workspace = true }
