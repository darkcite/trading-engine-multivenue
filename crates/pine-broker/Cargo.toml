[package]
name                   = "pine-broker"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description            = "PVM-5: Pine strategy.* broker emulation - the TradingView-equivalent broker (TvBroker) and the native desired-state reconciler that emits venue-neutral EngineIntents (NativeBroker). One heap allocation per broker, in new; none after."

[lib]
path = "src/lib.rs"

[dependencies]
# Exactly one, by spec impl-05 §1.3 (invariant I2).
pine-ir = { workspace = true }

[dev-dependencies]
# Not a workspace crate (I2 forbids only those): the money proptests of T2.
proptest = { workspace = true }
