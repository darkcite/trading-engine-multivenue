[package]
name = "pine-std"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "PVM builtin bodies (BUILTINS) and the load-time services pine-sema calls. No alloc, no clock."

[dependencies]            # contract §2, exactly
pine-ir   = { workspace = true }
pine-vm   = { workspace = true }
pine-spec = { workspace = true }
core-time = { workspace = true }

[features]
testing = []              # exposes pine_std::testing to crates/bench
avx2    = []              # x86_64 AVX2+FMA kernel twins in src/simd.rs; off until an x86_64 gate host exists

[dev-dependencies]
proptest = { workspace = true }
# Body tests drive bodies through pine-vm's own verify + VmInstance (impl-04 §7.1).
pine-vm  = { workspace = true, features = ["testkit"] }

[[bin]]
name = "scope-ledger"

[[bin]]
name = "gen-tz"
