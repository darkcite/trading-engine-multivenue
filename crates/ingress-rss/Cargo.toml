[package]
name         = "ingress-rss"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "RSS news poller. Latency class: Slow. Pushes news Signals with latency_class=Slow onto the signal ring."

[lib]
path = "src/lib.rs"

[dependencies]
core-net   = { workspace = true }
core-parse = { workspace = true }
core-ring  = { workspace = true }
core-time  = { workspace = true }
core-types = { workspace = true }
memchr     = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
