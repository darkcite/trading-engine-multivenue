[package]
name         = "exec-router"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Per-strategy execution routing (E1): the boot-fixed slot -> paper/live/off table and the compositing dispatcher over it."

[dependencies]
clob-dispatcher = { workspace = true }
core-types      = { workspace = true }
# E6: `WallAnchor`. The day cap's 00:00Z epoch is a WALL-clock fact and
# the engine stamps orders with `CLOCK_MONOTONIC_RAW`; this is the same
# conversion `strategy_bin15` uses, not a second one.
core-time       = { workspace = true }
# E6 commit 3: the ONE durable write (temp -> sync_all -> rename), for
# `exec.HALT`. An auto-halt that did not survive the scheduled daily
# restart would resume trading into whatever tripped it, unattended.
core-io         = { workspace = true }
# E6 commit 4: `O_NONBLOCK` for the halt-file read. `exec.HALT` is an
# OPERATOR-WRITABLE input read from the engine thread, and opening a
# FIFO without it blocks that thread for ever — a silent denial of
# service on the one engine that might be needed to flatten a
# position.
libc            = "0.2"
