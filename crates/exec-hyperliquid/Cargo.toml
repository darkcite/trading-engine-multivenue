[package]
name         = "exec-hyperliquid"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Hyperliquid L1 execution: zero-alloc msgpack encoding, the action hash and the Agent EIP-712 signature (E2), plus the mio+rustls exchange arm, fail-closed response scanner and testnet gate (E3)."

[dependencies]
signer-eip712 = { workspace = true }
# E3: the agent key lives in core_config::SecretKeyBytes — the ONE
# mlock'd, zeroize-on-drop representation docs/risk-policy.md allows a
# signing key to have after boot. Not reimplemented here.
core-config   = { workspace = true }
zeroize       = { workspace = true }
secp256k1     = { workspace = true }
core-net      = { workspace = true }
# E4: the ONE durable state-file write (temp -> sync_all -> rename).
core-io       = { workspace = true }
# E4: the canonical decimal scanners (scan_price_1e8, find_field).
core-parse    = { workspace = true }
# E4: the engine-facing dispatcher. `OrderDispatch` and the fill ring.
# No cycle: clob-dispatcher knows nothing of this crate.
clob-dispatcher = { workspace = true }
core-ring     = { workspace = true }
core-fill     = { workspace = true }
core-types    = { workspace = true }
# XH4b: the order gateway — the command/event duplex, pending table,
# deadline queue, make-before-break machine and idle policy — and the
# engine's monotonic clock the gateway stamps its events with.
exec-gateway  = { workspace = true }
core-time     = { workspace = true }
mio           = { workspace = true }
rustls        = { workspace = true }
# `testvenue` only: the scripted rustls Hyperliquid the gateway's tests
# and alloc gate 84 run against (never in a build that ships).
rcgen         = { workspace = true, optional = true }

[features]
testvenue = ["dep:rcgen"]

[dev-dependencies]
rcgen = { workspace = true }
# The integration tests drive the gateway against `testvenue`.
exec-hyperliquid = { path = ".", features = ["testvenue"] }
