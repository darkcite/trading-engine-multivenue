[package]
name         = "ingress-okx"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "OKX v5 public WebSocket ingress: bbo-tbt / trades / mark-price / funding-rate (+ books behind --okx-depth). Byte-scanner parsers, seqId/prevSeqId chain monitor, zero-alloc steady state."

[lib]
path = "src/lib.rs"

[dependencies]
core-types   = { workspace = true }
core-parse   = { workspace = true }
core-net     = { workspace = true }
core-ring    = { workspace = true }
core-metrics = { workspace = true }
core-time    = { workspace = true }
memchr       = { workspace = true }
mio          = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen    = { workspace = true }
rustls   = { workspace = true }
