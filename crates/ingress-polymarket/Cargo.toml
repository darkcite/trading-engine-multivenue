[package]
name         = "ingress-polymarket"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Polymarket CLOB WebSocket + REST ingress. Handwritten byte-scanner parser (no serde_json). Pushes Ticks onto a SPSC ring."

[lib]
path = "src/lib.rs"

[dependencies]
core-metrics = { path = "../core-metrics" }
core-net     = { workspace = true }
core-parse   = { workspace = true }
core-ring    = { workspace = true }
core-time    = { workspace = true }
core-types   = { workspace = true }
memchr       = { workspace = true }
mio          = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen    = { workspace = true }
rustls   = { workspace = true }
