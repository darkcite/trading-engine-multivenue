[package]
name         = "ingress-hyperliquid"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Hyperliquid public WebSocket ingress: bbo / l2Book / trades / activeAssetCtx / allMids / outcomeMetaUpdates (HIP-4). Byte-scanner parsers, per-coin staleness monitor, zero-alloc steady state."

[lib]
path = "src/lib.rs"

[dependencies]
core-types   = { workspace = true }
core-parse   = { workspace = true }
core-net     = { workspace = true }
core-ring    = { workspace = true }
core-metrics = { workspace = true }
core-time    = { workspace = true }
memchr       = { workspace = true }
mio          = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen    = { workspace = true }
rustls   = { workspace = true }
