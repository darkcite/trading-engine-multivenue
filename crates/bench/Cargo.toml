[package]
name         = "bench"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Criterion + dhat benches and allocation-assertion harness. Never linked into production binaries."

[lib]
path = "src/lib.rs"

[dependencies]
core-alloc = { workspace = true }
core-io    = { workspace = true }
core-ring  = { workspace = true }
core-parse = { workspace = true }
core-types = { workspace = true }
dhat       = { workspace = true }

[dev-dependencies]
criterion            = { workspace = true }
# Pulled in ONLY by the alloc_assertions integration test so we can
# round-trip real frames through the zero-alloc path.
# core-crypto: gate 34 hashes ruleset fixture bytes (§4.2 rule 1).
core-crypto          = { workspace = true }
ingress-ai           = { workspace = true }
ingress-polymarket   = { workspace = true }
ingress-binance      = { workspace = true }
ingress-deribit      = { workspace = true }
ingress-hyperliquid  = { workspace = true }
# MX8: the MEXC spot-PB + futures-JSON parsers and run loop.
ingress-mexc         = { workspace = true }
# HC3 gates 78/79: the Hypercall parsers and run loop.
ingress-hypercall    = { workspace = true }
# HC7 gate 80: the settlement window and the median-of-means law.
core-settle          = { workspace = true }
ingress-okx          = { workspace = true }
ingress-rpc          = { workspace = true }
core-net             = { workspace = true }
core-time            = { workspace = true }
# RG1 gate 41: the regime evaluator's tick + minute-roll path.
core-regime          = { workspace = true }
# VRP V1 gate 44: the option registry's hot lookups.
core-vol             = { workspace = true }
opt-registry         = { workspace = true }
book-builder         = { workspace = true }
strategy-ai-exec     = { workspace = true }
strategy-bin15       = { workspace = true }
strategy-core        = { workspace = true }
strategy-latency-arb = { workspace = true }
strategy-ev          = { workspace = true }
strategy-icdp        = { workspace = true }
strategy-cross-arb   = { workspace = true }
# E1 gate 53: the execution router's hot path.
exec-router          = { workspace = true }
# E2 gate 54: the Hyperliquid encode+sign path.
exec-hyperliquid     = { workspace = true }
signer-eip712        = { workspace = true }
# HC9 gate 84: the Hypercall arm's render + sign + answer scan.
exec-hypercall       = { workspace = true }
# HYPARB H1 gate 63: the AMM walk + arb solve.
core-amm             = { workspace = true }
# HYPARB H7 gate 64: the EVM sign + hash + hex render.
signer-evm           = { workspace = true }
# HYPARB H3 gate 66: the HyperEVM ingress session after the handshake.
ingress-hyperevm     = { workspace = true }
# HYPARB H2 gate 67: the AMM fill law on the paper matcher.
core-fill            = { workspace = true }
# HYPARB H4 gate 68: the slot-0 member — decision, carry, hedge, timer.
strategy-hyparb      = { workspace = true }
# XMM XH1: the slot-6 member rides the set's trade / order-event / timer gate.
strategy-xmm         = { workspace = true }
# HC11 gate 85: the slot-7 member over the paper held-quote law.
strategy-hcv         = { workspace = true }
# HYPARB H7c gate 71: the EVM write path either side of the socket.
# H9 gate 72: its `testnode` serves the HttpsPost cycle from a CHILD
# process (a server thread here would allocate under the global count).
exec-hyperevm        = { workspace = true, features = ["testnode"] }
rustls               = { workspace = true }
strategy-rule-tree   = { workspace = true }
strategy-set         = { workspace = true }
strategy-vm          = { workspace = true }
strategy-vrp         = { workspace = true }
strategy-xsd         = { workspace = true }
research-artifacts   = { workspace = true }
engine               = { workspace = true }
clob-dispatcher      = { workspace = true }
core-metrics         = { workspace = true }
core-latency         = { workspace = true }
engine-snapshot      = { workspace = true }

[[bench]]
name = "hot_path"
harness = false
