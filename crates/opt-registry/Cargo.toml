[package]
name         = "opt-registry"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Option instrument registry (VRP V1): SymbolId -> (expiry, strike, right, contract size) + the Deribit option-name parser the harness needs. Boot-built, one venue per boot; lookups are O(1) and allocate nothing."

[lib]
path = "src/lib.rs"

[dependencies]
core-types = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
