[package]
name         = "strategy-set"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "StrategySet: static bitmask fan-out over the in-tree strategies with AI Enable/Disable/Halt semantics (Phase 8f §7)"

[lib]
path = "src/lib.rs"

[dependencies]
core-regime          = { workspace = true }
# HAR H3.7: the state writer's mailboxes (each series' state leaves the
# engine thread at its day close).
core-ring            = { workspace = true }
core-time            = { workspace = true }
core-types           = { workspace = true }
# HAR H3.3: the long-tenor HAR series the set owns.
core-vol             = { workspace = true }
strategy-ai-exec     = { workspace = true }
strategy-core        = { workspace = true }
strategy-hyparb      = { workspace = true }
strategy-bin15       = { workspace = true }
strategy-vm          = { workspace = true }
strategy-vrp         = { workspace = true }
strategy-xsd         = { workspace = true }
strategy-xmm         = { workspace = true }
