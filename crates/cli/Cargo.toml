[package]
name         = "cli"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Main binary. Parses CLI args, loads config via core-config, wires together ingress + engine + strategy + dispatcher."
# RG6: `build.rs` (auto-detected) records the git commit into
# MULTIVENUE_GIT_SHA for the `/state` boot section (soft — "unknown"
# without git).

[lib]
path = "src/lib.rs"

[[bin]]
name = "multivenue-engine"
path = "src/bin/multivenue-engine.rs"

[dependencies]
core-config          = { workspace = true }
core-regime          = { workspace = true }
core-io              = { workspace = true }
core-net             = { workspace = true }
core-ring            = { workspace = true }
core-time            = { workspace = true }
core-types           = { workspace = true }
# VRP V1: option sym -> (expiry, strike, right, contract size).
core-vol             = { workspace = true }
# VRP X1: the ONE modelled fill law, shared with the paper dispatcher.
core-fill            = { workspace = true }
opt-registry         = { workspace = true }
engine               = { workspace = true }
engine-snapshot      = { workspace = true }
strategy-core        = { workspace = true }
# HYPARB H3b: the HyperEVM pool-event ingress.
ingress-hyperevm     = { workspace = true }
# HYPARB H2/H3b: the pool-event codec (bounds shared with the universe).
core-amm             = { workspace = true }
strategy-ev          = { workspace = true }
strategy-bin15       = { workspace = true }
# HYPARB H5: the slot-0 member's params, built by `hyparb_boot`.
strategy-hyparb      = { workspace = true }
strategy-rule-tree   = { workspace = true }
strategy-icdp        = { workspace = true }
strategy-set         = { workspace = true }
# 8h backtest harness (cli::backtest): drives the real ruleset VM
# offline and hashes the candidate artifact exactly like the worker.
strategy-vm          = { workspace = true }
strategy-vrp         = { workspace = true }
strategy-xsd         = { workspace = true }
# XMM XH1: the slot-6 member's params, built by `xmm_boot`.
strategy-xmm         = { workspace = true }
core-crypto          = { workspace = true }
research-artifacts   = { workspace = true }
clob-dispatcher      = { workspace = true }
exec-router          = { workspace = true }
# E3: the `exec-smoke` arm — the TESTNET-ONLY signature gate. This is
# the crate's ONLY caller in the binary; the engine's dispatch path
# does not reach it (LIVE_ARM_VENUES is empty and asserted so).
exec-hyperliquid     = { workspace = true }
# HC9 (O-HC19): the Hypercall order arm, driven by the `hypercall-live`
# operator verbs (the engine does not arm it before slot 7's ruling).
exec-hypercall       = { workspace = true }
# HYPARB H8: the HyperEVM write path, TESTNET ONLY (O-H5) — the shadow of
# each paper AMM decision (O-H12) and the `evm-testnet` operator verbs.
exec-hyperevm        = { workspace = true }
signer-eip712        = { workspace = true }
zeroize              = { workspace = true }
book-builder         = { workspace = true }
core-metrics         = { workspace = true }
core-latency         = { workspace = true }
tui                  = { workspace = true }
ingress-polymarket   = { workspace = true }
ingress-binance      = { workspace = true }
ingress-okx          = { workspace = true }
ingress-deribit      = { workspace = true }
ingress-bybit        = { workspace = true }
ingress-mexc         = { workspace = true }
# HC4: the Hypercall boot discovery (HC5: the ingress spawn).
ingress-hypercall    = { workspace = true }
ingress-hyperliquid  = { workspace = true }
ingress-rpc          = { workspace = true }
ingress-ai           = { workspace = true }
clap                 = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
mio                  = { workspace = true }
rustls               = { workspace = true }
rustls-pki-types     = { workspace = true }
libc                 = "0.2"

[dev-dependencies]
# HYPARB H8: the scripted JSON-RPC node the shadow tests run against.
exec-hyperevm        = { workspace = true, features = ["testnode"] }
# core-crypto moved to [dependencies] with the 8h backtest harness —
# ruleset_engine_wiring keeps hashing artifacts through it unchanged.
# backtest_harness merge ordering proptests (8h design §12).
proptest             = { workspace = true }
