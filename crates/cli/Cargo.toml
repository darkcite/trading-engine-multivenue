[package]
name         = "cli"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Main binary. Parses CLI args, loads config via core-config, wires together ingress + engine + strategy + dispatcher."
# RG6: `build.rs` (auto-detected) records the git commit into
# MULTIVENUE_GIT_SHA for the `/state` boot section (soft — "unknown"
# without git).

[lib]
path = "src/lib.rs"

[[bin]]
name = "multivenue-engine"
path = "src/bin/multivenue-engine.rs"

[dependencies]
core-config          = { workspace = true }
core-regime          = { workspace = true }
core-io              = { workspace = true }
core-net             = { workspace = true }
core-ring            = { workspace = true }
core-time            = { workspace = true }
core-types           = { workspace = true }
engine               = { workspace = true }
engine-snapshot      = { workspace = true }
strategy-core        = { workspace = true }
strategy-latency-arb = { workspace = true }
strategy-ev          = { workspace = true }
strategy-cross-arb   = { workspace = true }
strategy-rule-tree   = { workspace = true }
strategy-icdp        = { workspace = true }
strategy-set         = { workspace = true }
# 8h backtest harness (cli::backtest): drives the real ruleset VM
# offline and hashes the candidate artifact exactly like the worker.
strategy-vm          = { workspace = true }
core-crypto          = { workspace = true }
research-artifacts   = { workspace = true }
clob-dispatcher      = { workspace = true }
book-builder         = { workspace = true }
core-metrics         = { workspace = true }
core-latency         = { workspace = true }
tui                  = { workspace = true }
ingress-polymarket   = { workspace = true }
ingress-binance      = { workspace = true }
ingress-okx          = { workspace = true }
ingress-deribit      = { workspace = true }
ingress-bybit        = { workspace = true }
ingress-hyperliquid  = { workspace = true }
ingress-rpc          = { workspace = true }
ingress-ai           = { workspace = true }
clap                 = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
mio                  = { workspace = true }
rustls               = { workspace = true }
rustls-pki-types     = { workspace = true }
libc                 = "0.2"

[dev-dependencies]
# core-crypto moved to [dependencies] with the 8h backtest harness —
# ruleset_engine_wiring keeps hashing artifacts through it unchanged.
# backtest_harness merge ordering proptests (8h design §12).
proptest             = { workspace = true }
