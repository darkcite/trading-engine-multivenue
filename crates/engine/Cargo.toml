[package]
name         = "engine"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Engine<S: Strategy>. Compile-time-monomorphized main loop. Drains tick/signal/fill rings and dispatches to the strategy. Single writer."

[lib]
path = "src/lib.rs"

[dependencies]
core-ring       = { workspace = true }
core-time       = { workspace = true }
core-types      = { workspace = true }
core-latency    = { workspace = true }
strategy-core   = { workspace = true }
clob-dispatcher = { workspace = true }
# AiIngressStatus only: the engine drain site is the designated writer
# of `expired_total` (Phase 8f §4.4 / status.rs writer discipline).
ingress-ai      = { workspace = true }
# SlotCapture<Fill> only: the engine thread stages every dispatched
# fill to engine-fills.pmlr (Phase 8f item 6 — the positions/P&L feed).
core-io         = { workspace = true }
