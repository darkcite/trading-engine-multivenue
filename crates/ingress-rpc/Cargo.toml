[package]
name         = "ingress-rpc"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Polygon JSON-RPC ingress (Alchemy primary, QuickNode failover). Blocks, receipts, CTF events. Never the hot path — event feed only."

[lib]
path = "src/lib.rs"

[dependencies]
core-metrics = { path = "../core-metrics" }
core-net     = { workspace = true }
core-parse   = { workspace = true }
core-ring    = { workspace = true }
core-time    = { workspace = true }
core-types   = { workspace = true }
memchr       = { workspace = true }
mio          = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen    = { workspace = true }
rustls   = { workspace = true }
