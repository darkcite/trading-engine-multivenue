[package]
name         = "ingress-hypercall"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
description  = "Hypercall public ingress (HC3/HC4): the indicative quote-provider WS (option BBO ticks, index marks, trades, per-provider quotes) + the REST /options-summary poller + boot /markets discovery. Byte-scanner parsers, zero-alloc steady state. Data-only (O-HC1)."

[lib]
path = "src/lib.rs"

[dependencies]
core-types     = { workspace = true }
core-parse     = { workspace = true }
core-net       = { workspace = true }
core-ring      = { workspace = true }
core-metrics   = { workspace = true }
core-time      = { workspace = true }
options-select = { workspace = true }
memchr         = { workspace = true }
mio            = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# TLS-loopback integration test (tests/hypercall_tls_loopback.rs) — the
# binance/okx/mexc pattern; test-only, never linked into release.
rcgen    = { workspace = true }
rustls   = { workspace = true }
