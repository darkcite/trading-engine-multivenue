[project]
name            = "claude-worker"
version         = "0.1.0"
description     = "Offline Claude strategy researcher for multivenue trading engine"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "Apache-2.0" }

dependencies = [
    # Anthropic SDK — used only in the offline worker, never in hot path.
    "anthropic>=0.40.0",
    # Structured logging — offline-only.
    "structlog>=24.1.0",
    # CLI entry.
    "typer>=0.12.0",
    # TOML config parsing (stdlib `tomllib` is read-only; tomli-w for round-trip).
    "tomli-w>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
claude-worker = "claude_worker.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_worker"]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
# Enforce codebase rule: "Full `import x` only. Never `from x import y`."
# E / F: pyflakes-style errors (unused imports, undefined names, etc.)
# I: isort-style import ordering.
# PL: pylint-like checks.
# RUF: ruff-native lints.
select = ["E", "F", "I", "PL", "RUF"]

# ICN001 would force short aliases; we forbid aliasing too. Keep imports literal.
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports entirely.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# Disallow `from ... import ...` style by forcing single-line full-module imports.
force-single-line     = true
force-sort-within-sections = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts    = "-ra --strict-markers --strict-config"
testpaths  = ["tests"]
markers    = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that would require network (must be mocked)",
]

[tool.mypy]
python_version       = "3.12"
strict               = true
warn_unused_ignores  = true
disallow_any_generics = true
