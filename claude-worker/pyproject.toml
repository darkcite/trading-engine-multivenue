[project]
name            = "claude-worker"
version         = "0.2.0"
description     = "AI-ingress worker for the multivenue trading engine: serve daemon + operator verbs (8f rewrite)"
readme          = "README.md"
requires-python = ">=3.14"
license         = { text = "Apache-2.0" }

dependencies = [
    # Anthropic SDK — constructed inside `serve` (llm.py seam) ONLY; verbs never touch it.
    "anthropic>=0.122.0",
    # HTTP client for news_watcher feed polling + rate-budgeted venue REST.
    "httpx>=0.28.1",
    # CLI: serve + operator verbs (design §13 Q4 — Typer verified under 3.14).
    "typer>=0.27.1",
    # Structured logging — offline-only, never in any engine hot path.
    "structlog>=26.1.0",
]

# Deferred from item 2 by design (no dangling entry point before cli.py
# existed); added with the verb surface in item 12.
[project.scripts]
claude-worker = "claude_worker.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_worker"]

[tool.ruff]
line-length    = 100
target-version = "py314"

[tool.ruff.lint]
# Enforce codebase rule: "Full `import x` only. Never `from x import y`."
# E / F: pyflakes-style errors (unused imports, undefined names, etc.)
# I: isort-style import ordering.
# PL: pylint-like checks.
# RUF: ruff-native lints.
select = ["E", "F", "I", "PL", "RUF"]

# ICN001 would force short aliases; we forbid aliasing too. Keep imports literal.
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports entirely.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal wire values (seqs, prices, offsets) by
# design — naming each literal would obscure the golden fixtures.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
# Disallow `from ... import ...` style by forcing single-line full-module imports.
force-single-line     = true
force-sort-within-sections = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts    = "-ra --strict-markers --strict-config"
testpaths  = ["tests"]
markers    = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that would require network (must be mocked)",
]

[tool.mypy]
python_version        = "3.14"
strict                = true
warn_unused_ignores   = true
disallow_any_generics = true
