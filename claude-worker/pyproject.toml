[project]
name            = "claude-worker"
version         = "0.2.0"
description     = "AI-ingress worker for the multivenue trading engine: serve daemon + operator verbs (8f rewrite)"
readme          = "README.md"
requires-python = ">=3.14"
# PEP 639 SPDX expression. The deprecated PEP 621 `{ text = ... }` table
# form was replaced 2026-08-27 (license audit G4). LICENSE and NOTICE here
# are copies of the repo-root originals: PEP 639 `license-files` cannot
# reference paths outside the project root, and without them the built
# wheel/sdist would ship with NO license file at all (Apache-2.0 §4(a) and
# §4(d)). Keep the copies in sync with `make sync-license` from the repo
# root; `make license-check` fails if they drift.
license         = "Apache-2.0"
license-files   = ["LICENSE", "NOTICE"]
authors         = [{ name = "Anton (darkcite)", email = "qqq.darkcite@gmail.com" }]

dependencies = [
    # Anthropic SDK — constructed inside `serve` (llm.py seam) ONLY; verbs never touch it.
    # >=1.4.0 for `claude-fable-5-1` (MODEL_STRATEGIST): 0.122.0's model Literal
    # knows the Fable family as `claude-fable-5` alone. The surface the worker
    # touches is two names — `anthropic.Anthropic` and
    # `anthropic.types.TextBlock` — both unchanged across the 0.x -> 1.x
    # boundary, which is why a major bump is safe here.
    "anthropic>=1.4.0",
    # HTTP client for news_watcher feed polling + rate-budgeted venue REST.
    "httpx>=0.28.1",
    # CLI: serve + operator verbs (design §13 Q4 — Typer verified under 3.14).
    "typer>=0.27.1",
    # Structured logging — offline-only, never in any engine hot path.
    "structlog>=26.1.0",
]

# Deferred from item 2 by design (no dangling entry point before cli.py
# existed); added with the verb surface in item 12.
[project.scripts]
claude-worker = "claude_worker.cli:main"
# Second console script, NOT a claude-worker verb: the archiver touches no
# state.db, no ai.sock and no seq namespace, so it is outside the worker
# serialization guard by design. For SHORT interactive commands only — anything
# long runs as `~/multivenue/venv/bin/python3 scripts/archive-run.py`, because
# every worker lane's guard is `pgrep -f 'claude[-_]worke[r]'` and this name
# would match it (S-LAW 15, the CMDLINE LAW).
multivenue-archive = "claude_worker.archive:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
]
# Kronos sidecar only (lanes plan §3a.3, ruling D8). OPT-IN: the base
# worker install stays torch-free, so every existing verb, the serve
# daemon and CI keep their current dependency surface. Install with
# `uv sync --group kronos` on the host that runs the forecaster; the
# engine never links any of it (forecasts reach the hot path as 64-byte
# AI command frames, never as a Python object).
#
# These are upstream Kronos' REAL imports (torch, numpy, pandas, einops,
# huggingface_hub, tqdm) plus safetensors, which its `from_pretrained`
# loader uses. Its own `requirements.txt` pins (pandas 2.2) are stale and
# are deliberately NOT what we install. All seven resolve on CPython
# 3.14.7 arm64 (uv dry run 2026-09-05, re-run at install 2026-09-07).
#
# torch is pinned EXACTLY: a minor torch bump can change MPS kernel
# numerics, and the KK parity gate (§3a.4) asserts logits max |Δ| == 0.0
# against goldens generated on one build. Moving it is a deliberate act
# that re-runs the goldens, not a resolver decision.
kronos = [
    "torch==2.14.0",
    "numpy>=2.5",
    "pandas>=3.0",
    "einops>=0.8",
    "huggingface_hub>=1.30",
    "tqdm",
    "safetensors>=0.8",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_worker"]

[tool.ruff]
line-length    = 100
target-version = "py314"

[tool.ruff.lint]
# Enforce codebase rule: "Full `import x` only. Never `from x import y`."
# E / F: pyflakes-style errors (unused imports, undefined names, etc.)
# I: isort-style import ordering.
# PL: pylint-like checks.
# RUF: ruff-native lints.
select = ["E", "F", "I", "PL", "RUF"]

# ICN001 would force short aliases; we forbid aliasing too. Keep imports literal.
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports entirely.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal wire values (seqs, prices, offsets) by
# design — naming each literal would obscure the golden fixtures.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
# Disallow `from ... import ...` style by forcing single-line full-module imports.
force-single-line     = true
force-sort-within-sections = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts    = "-ra --strict-markers --strict-config"
testpaths  = ["tests"]
markers    = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that would require network (must be mocked)",
    # KK parity gate (Kronos lanes plan §3a.4): needs the optional
    # `kronos` dependency group AND the installed vendor snapshot +
    # weights, so it is opt-in (`-m kronos`) and skips without them.
    # Everything else in the suite stays torch-free.
    "kronos: Kronos golden-parity tests (needs `uv sync --group kronos` + installed artifacts)",
]

[tool.mypy]
python_version        = "3.14"
strict                = true
warn_unused_ignores   = true
disallow_any_generics = true
