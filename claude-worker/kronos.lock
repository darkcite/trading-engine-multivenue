# ---- weights -------------------------------------------------------------
# `kind = "model"` entries carry the context bound and the tokenizer they
# were trained with (upstream README "Model Zoo"); `kind = "tokenizer"`
# entries are the paired quantizers. D4 rules `Kronos-base` everywhere;
# mini/small stay in the lock because C0 sweeps them for the record.

[weights."Kronos-base"]
