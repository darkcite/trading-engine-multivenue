# Kronos runtime-artifact lock — DATA, not code (Kronos lanes plan §3a.2,
# ruling D13: upstream as-is, pinned by hash OUTSIDE git).
#
# Nothing described here is ever vendored into this tree. The installer
# (`python -m claude_worker.kronos install`) fetches each file, verifies
# its sha256, and writes it under ~/multivenue/vendor/kronos/<sha>/ (the
# upstream snapshot) and ~/multivenue/artifacts/kronos/<name>/ (the
# weights). A mismatching hash is a REFUSAL, never a warning, and nothing
# is written on a refusal.
#
# Why per-file raw URLs and not a GitHub archive tarball: a tarball's
# bytes are not stable across GitHub's compression settings, so its
# sha256 is not a pin. A raw blob at a commit is immutable. The weight
# URLs are likewise pinned to the HF repo REVISION each file was
# downloaded at, not to `main` — `main` moving would turn a reinstall
# into a refusal instead of a byte-identical fetch.
#
# Hashes were computed with `shasum -a 256` over the copies on the
# research test bed (~/Kronos_test) on 2026-09-07; the byte counts match
# the plan's §3a.2 record exactly (16440776 / 98980656 / 409264008 /
# 15842376 / 15842368).
#
# Licences: the upstream snapshot is MIT (its own LICENSE is fetched and
# stored beside the code); the weights are released under the same
# upstream MIT terms. Both carry an entry in THIRD-PARTY-NOTICES.md.

[upstream]
repo    = "shiyu-coder/Kronos"
commit  = "67b630e67f6a18c9e9be918d9b4337c960db1e9a"
license = "MIT"

[[upstream.file]]
path   = "model/__init__.py"
url    = "https://raw.githubusercontent.com/shiyu-coder/Kronos/67b630e67f6a18c9e9be918d9b4337c960db1e9a/model/__init__.py"
sha256 = "f8f856ca3fedadcaac97e196be23d1aeda1c3c9ffe8903d66d43ea3bcac6240c"
bytes  = 412

[[upstream.file]]
path   = "model/kronos.py"
url    = "https://raw.githubusercontent.com/shiyu-coder/Kronos/67b630e67f6a18c9e9be918d9b4337c960db1e9a/model/kronos.py"
sha256 = "0a5f90282e2039c2de0771473419715c845def154896dbd0f5747837e6241032"
bytes  = 30133

[[upstream.file]]
path   = "model/module.py"
url    = "https://raw.githubusercontent.com/shiyu-coder/Kronos/67b630e67f6a18c9e9be918d9b4337c960db1e9a/model/module.py"
sha256 = "a07edbadc0e96804c8158c021bbc6063bb7cc43b34d7fc470d5c8ff2005a409f"
bytes  = 23426

[[upstream.file]]
path   = "LICENSE"
url    = "https://raw.githubusercontent.com/shiyu-coder/Kronos/67b630e67f6a18c9e9be918d9b4337c960db1e9a/LICENSE"
sha256 = "acb2d194d378204e5f2be4dcd24d39ecac437903620c790c3315a96dab388fdc"
