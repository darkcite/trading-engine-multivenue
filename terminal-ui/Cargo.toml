[workspace]
resolver = "3"
members = ["crates/term-ui-core", "crates/term-render", "crates/term-ui-web"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
term-proto = { path = "../crates/term-proto" }
egui = { version = "=0.33.3", default-features = false }
egui-wgpu = { version = "=0.33.3", default-features = false }
eframe = { version = "=0.33.3", default-features = false }
wgpu = { version = "27", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
