# The UI workspace's own cargo-deny policy (plan v2.1 §4.11.1, R-T18).
# cargo-deny reads every target listed here: `cargo tree -i` alone missed
# the target-gated tokio.
[graph]
targets = ["wasm32-unknown-unknown", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[bans]
multiple-versions = "allow"
# Carry the root deny.toml's list here when this lands (names from the plan).
deny = [
  { name = "tokio" }, { name = "serde_json" }, { name = "reqwest" },
  { name = "async-std" }, { name = "ethers" }, { name = "alloy" }, { name = "openssl" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "MPL-2.0", "CC0-1.0"]
# R-T19 is the operator's ruling. The spike takes its recommended option (a):
# egui's default fonts from crates.io, with a crate-scoped exception.
exceptions = [
  { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
private = { ignore = true }
