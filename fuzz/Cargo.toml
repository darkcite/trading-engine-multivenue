[package]
name    = "polymarket-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# NOT inheritable: fuzz/ is `exclude`d from the workspace (cargo-fuzz
# convention), so `license.workspace = true` is unavailable here. Keep
# this literal in sync with [workspace.package] in ../Cargo.toml.
license = "Apache-2.0"
authors = ["Anton (darkcite) <qqq.darkcite@gmail.com>"]

[package.metadata]
cargo-fuzz = true

[dependencies]
exec-hyperliquid = { path = "../crates/exec-hyperliquid" }
# bn_cid / bn_wsapi_frame / bn_user_event / bn_rest_body / bn_account /
# bn_mode: the BX6 arm's scanners and boot assertions; BX7 widens
# bn_user_event (every product's and mode's events, the not-cross walk's
# agreement law, raw ⇔ combined), bn_account (COIN-M and Portfolio Margin's
# positions) and bn_mode (a row's margin type and leverage, PM's key and
# unified account), and adds bn_rest_answer (the REST order route's answer).
# BX8 adds bn_spot_event (spot's user-data frame, its event and the spot
# account read, each judged by an oracle of the target's own). BX9 adds
# bn_option_rest (the options account, positions, exercise records, index
# and route answer; the settlement price) and widens bn_user_event (an
# option's commission asset; RISK_LEVEL_CHANGE ⇔ riskLevelChange).
exec-binance     = { path = "../crates/exec-binance" }
# TERM wire (TERM plan §4.11.2): term_proto_frame / _intent / _dec.
term-proto       = { path = "../crates/term-proto" }
# TERM live-feed scanners: term_live_scan.
terminal         = { path = "../crates/terminal" }
# TERM door frame law: term_door_frame.
ingress-term     = { path = "../crates/ingress-term" }
# cargo-fuzz runtime.
libfuzzer-sys = "0.4"
# pine_lex_parse: the PVM lane's Pine v5/v6 front end (impl-01 section 7.12).
pine-lang = { path = "../crates/pine-lang" }
pine-ir   = { path = "../crates/pine-ir" }

# Workspace crates under test.
ingress-ai         = { path = "../crates/ingress-ai" }
core-types         = { path = "../crates/core-types" }
# ruleset_json: honest-hash pass needs the same sha256 the validator
# checks against (§4.2 rule 1).
core-crypto        = { path = "../crates/core-crypto" }
ingress-polymarket = { path = "../crates/ingress-polymarket" }
# pm_rolling_frame (PMJ J1b): the rolling driver's rings and status.
core-ring          = { path = "../crates/core-ring" }
core-metrics       = { path = "../crates/core-metrics" }
# jup_wire (PMJ J3): the Solana transaction guard and the Prediction API's answers.
exec-jupiter       = { path = "../crates/exec-jupiter" }
ingress-binance    = { path = "../crates/ingress-binance" }
ingress-bybit      = { path = "../crates/ingress-bybit" }
ingress-mexc       = { path = "../crates/ingress-mexc" }
ingress-rpc        = { path = "../crates/ingress-rpc" }
ingress-okx        = { path = "../crates/ingress-okx" }
book-builder    = { path = "../crates/book-builder" }
ingress-deribit    = { path = "../crates/ingress-deribit" }
ingress-hyperliquid = { path = "../crates/ingress-hyperliquid" }
core-net           = { path = "../crates/core-net" }
core-parse         = { path = "../crates/core-parse" }
signer-eip712      = { path = "../crates/signer-eip712" }
clob-dispatcher    = { path = "../crates/clob-dispatcher" }
# universe_toml: the M1 boot-universe config parser (core-config).
core-config        = { path = "../crates/core-config" }
# evm_rlp: the HYPARB H7 EIP-1559 renderer.
signer-evm         = { path = "../crates/signer-evm" }
# amm_tick_walk / amm_map_payload: the HYPARB H1 AMM walk + arb solve, the
# O-H19 tick-map maintenance and the pool-event payload codec.
core-amm           = { path = "../crates/core-amm" }
# hyperevm_decode: the HYPARB H3 log/envelope decoders + pool snapshot machine.
ingress-hyperevm   = { path = "../crates/ingress-hyperevm" }
# amm_book: the HYPARB H2 AMM fill law (pool book + judge).
core-fill          = { path = "../crates/core-fill" }
# hypercall_{ws_frame,markets,summary}: the HC3/HC4 Hypercall parsers.
ingress-hypercall  = { path = "../crates/ingress-hypercall" }
# evm_exec_response: the HYPARB H7c write-path response scanners.
exec-hyperevm      = { path = "../crates/exec-hyperevm" }
# hypercall_{response,userws}: the HC9 order arm's answer and event scanners.
exec-hypercall     = { path = "../crates/exec-hypercall" }

