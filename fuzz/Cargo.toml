[package]
name    = "polymarket-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# cargo-fuzz runtime.
libfuzzer-sys = "0.4"

# Workspace crates under test.
ingress-ai         = { path = "../crates/ingress-ai" }
core-types         = { path = "../crates/core-types" }
# ruleset_json: honest-hash pass needs the same sha256 the validator
# checks against (§4.2 rule 1).
core-crypto        = { path = "../crates/core-crypto" }
ingress-polymarket = { path = "../crates/ingress-polymarket" }
ingress-binance    = { path = "../crates/ingress-binance" }
ingress-rpc        = { path = "../crates/ingress-rpc" }
ingress-okx        = { path = "../crates/ingress-okx" }
ingress-deribit    = { path = "../crates/ingress-deribit" }
ingress-hyperliquid = { path = "../crates/ingress-hyperliquid" }
core-net           = { path = "../crates/core-net" }
core-parse         = { path = "../crates/core-parse" }
signer-eip712      = { path = "../crates/signer-eip712" }
clob-dispatcher    = { path = "../crates/clob-dispatcher" }
# universe_toml: the M1 boot-universe config parser (core-config).
core-config        = { path = "../crates/core-config" }

[[bin]]
name   = "ai_cmd_frame"
path   = "fuzz_targets/ai_cmd_frame.rs"
test   = false
doc    = false
bench  = false

