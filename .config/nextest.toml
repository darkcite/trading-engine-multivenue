# HK8c (2026-10-13): the workspace's nextest configuration.
#
# The test below is a standing "isolation-disproven flake": red under
# full-workspace parallel load, green alone. It runs in its own process
# already; what it shares is the machine: the scrape hammer opens many
# loopback connections at once. Run one at a time, a red is a red.
#
# The six allocation tests that were here left with A-S7-101 (HK, 2026-10-14):
# their reds were libtest's runner thread allocating (6 / 1 012 B) inside the
# window when the test thread won the race; `core-alloc` no longer counts the
# runner thread, so they run in parallel again.
#
# Add a test here only with the reason it is load-sensitive; never to hide
# a test that fails alone.

# HK23 (2026-10-15): before 0.9.145, nextest on macOS could hand a test a
# sibling's capture pipe (std makes a pipe, THEN marks it close-on-exec; no
# pipe2 there), and a random test spawning nothing was reported LEAK at
# ~0.2 s. A LEAK under an older nextest is that race, not the test.
nextest-version = { recommended = "0.9.145" }

[test-groups]
load-sensitive = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
package(core-metrics) & binary(server_loopback)
    & test(/(^|::)scrape_hammer_all_succeed_without_conn_errors$/)
"""
test-group = "load-sensitive"
